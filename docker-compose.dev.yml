# Docker Compose Configuration for Local Development

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: absensi-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projek_absensi
      MYSQL_USER: absensi_user
      MYSQL_PASSWORD: absensi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - absensi-network

  # PHP Backend (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absensi-backend-dev
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
    depends_on:
      - mysql
    networks:
      - absensi-network

  # Nginx for Backend
  nginx:
    image: nginx:alpine
    container_name: absensi-nginx-dev
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - absensi-network

  # Python Face Service
  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: absensi-face-dev
    ports:
      - "8001:8001"
    volumes:
      - ./face-service:/app
    environment:
      - FACE_SERVICE_HOST=0.0.0.0
      - FACE_SERVICE_PORT=8001
    networks:
      - absensi-network

networks:
  absensi-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
