name: Weekly Report

on:
  schedule:
    # Run at 8:00 AM UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  generate-report:
    name: Generate Weekly Attendance Report
    runs-on: ubuntu-latest

    steps:
      - name: Generate Report
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ProjekAbsensi
            docker exec absensi-backend php artisan report:weekly

      - name: Upload Report to Cloud
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Upload weekly report to Google Drive
            if command -v rclone &> /dev/null; then
              rclone copy ~/ProjekAbsensi/backend/storage/app/reports/ gdrive:AbsensiReports/ --include "*.xlsx"
            fi
